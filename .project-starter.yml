# project_starter_v5 — project configuration
# Created at project initialization. Used by .githooks/pre-commit and all verify scripts.
# Do not rename this file.
#
# ─────────────────────────────────────────────────────────────────────────────
# STEP 0 (required before anything else):
#   Replace [your-project-type] below with your actual project type.
#   The pre-commit hook will block ALL commits until this placeholder is removed.
#   Valid values: web-app | cli-tool | library | data-pipeline | ml-pipeline
#                 microservices | llm-app | iac | mobile-app
# ─────────────────────────────────────────────────────────────────────────────

project_type: [your-project-type]
# Hybrid: data-pipeline+web-app

docs_path: docs/
# Path to your docs/ directory relative to the project root.

task_type:
# Optional. Filters .ai/AI_CONTEXT.md to task-relevant documents.
# Valid values: feature | pipeline-stage | bug-fix | sprint-end | eval-run | iac-change
# Leave blank to show all Required documents for the project type.
# Can also be set per-task in docs/current-state.md → Task Type field (overrides this value).

test_command:
# Optional. The exact shell command that runs this project's test suite, e.g.
# `pytest -q` | `npm test` | `go test ./...` | `cargo test`. When set, .githooks/pre-commit
# actually executes it on every commit and blocks if it exits non-zero. Leave blank to skip
# this gate (default — matches prior behavior).
#
# This is a different check from verify_tests.py (run separately by pre-commit): that one only checks whether
# docs/specs/test-report.md has been filled with non-placeholder numbers — it never runs
# anything, so a fabricated "42 passed" line would satisfy it. test_command actually runs
# the suite and blocks on a real failure (or the command not existing).
#
# Example (Python/pytest):
#   test_command: pytest -q
#
# Point this at a fast subset (unit tests) if your full suite is slow — every commit runs
# it. Reserve the full/integration suite for CI.

spec_code_adapter:
spec_code_spec:
spec_code_src:
# Optional — all three must be set together to enable the spec ↔ code drift gate
# (verify_spec_code.py) in .githooks/pre-commit and in the validator sequences rendered
# by orchestrator.py. Leave all three blank to skip the gate (default — matches prior behavior).
#
# spec_code_adapter: the registered framework adapter name, e.g. fastapi | flask | express |
#   django | click | typer | airflow | dagster | prefect | luigi | python_library | typescript |
#   tool_schema | langchain | terraform | pulumi | ansible | react_native | flutter | swiftui —
#   see README.md → Spec ↔ Code Validator → Adapters for the full list.
# spec_code_spec: path to the contract document the adapter reads, e.g. docs/specs/api-contract.md
# spec_code_src: path to the source tree the adapter scans, e.g. src/
#
# Example (FastAPI web app):
#   spec_code_adapter: fastapi
#   spec_code_spec: docs/specs/api-contract.md
#   spec_code_src: src/
#
# Only one adapter mapping is supported here. Projects needing more than one contract
# validated (e.g. multiple services) can still run verify_spec_code.py directly with
# additional --adapter/--spec/--src invocations — see README.md.

security_scan_src:
# Optional. Enables the SAST gate (verify_security.py) in .githooks/pre-commit and in the
# validator sequences rendered by orchestrator.py. Leave blank to skip the gate (default —
# matches prior behavior). Wraps bandit (Python), eslint-plugin-security (JS/TS), and Semgrep
# (Go/Ruby/Java/PHP/Kotlin/Vue) — install whichever applies to your project; a language with
# no tool installed is skipped with a [WARN], not silently reported clean. See README.md ->
# Security Scan (SAST).
#
# Example:
#   security_scan_src: src/
#
# Usually the same path as spec_code_src, if that's already set above.

prose_scan_enabled:
# Optional (true/false). Enables the prose-quality gate (verify_prose.py) in
# .githooks/pre-commit — runs on docs_path above, no separate path needed. Leave blank/false
# to skip the gate (default). Wraps Vale (https://vale.sh) with a small custom style shipped
# in templates/script/validators/_prose_style/ — catches vague wording and prose-form
# placeholders (a bare "TBD" or "coming soon" sentence) that verify_docs.py's structural
# fill-quality checks can't see. See README.md -> Prose Quality (Vale).
#
# Example:
#   prose_scan_enabled: true
