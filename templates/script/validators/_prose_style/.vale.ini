; Vale config shipped by project_starter_v5 for verify_prose.py.
; Self-contained on purpose — StylesPath points at ./styles/Custom, a small set of rules
; written for this repo (no `vale sync` / network dependency on an external style
; package like Google/Microsoft, matching this framework's offline-friendly design
; elsewhere). Extend styles/Custom/ with more .yml rules as needed; every rule here is
; deliberately narrow — see README.md -> Prose Quality (Vale) for what this does and
; does not catch.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Custom
