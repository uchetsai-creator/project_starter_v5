name: CI

# Runs the framework's own safety net on every push/PR instead of relying on
# whoever is working locally to remember `pytest tests/` and
# `verify_framework.py --strict` — both were previously enforced only via the
# git pre-commit hook, which `--no-verify` bypasses.
#
# ubuntu + windows are both in the matrix on purpose: two real, previously-undetected
# bugs (a hardcoded '/' path separator in verify_framework.py, and a missing
# encoding="utf-8" in a detect_type.py test) only reproduced on Windows and would
# have shipped silently on a Linux-only pipeline.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      # Belt-and-suspenders alongside each script's own sys.stdout.reconfigure(): forces
      # every Python process this job runs into UTF-8 mode, regardless of the runner's
      # default console codepage (confirmed cp1252 on windows-latest, which can't encode
      # "→" — see CHANGELOG.md for the two real crashes this caused before both fixes).
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # requirements-dev.txt is the single source of truth for the pytest version floor
        # and the pyyaml runtime dep — this repo isn't a distributable package (see
        # pyproject.toml's [project] comment for why `pip install .[dev]` doesn't work), so
        # this file is what README.md's "Running the test suite" section also points at.
        # PyYAML is a hard runtime dependency of _workflow_utils.py / verify_registry.py —
        # without it, importing verify_registry.py as a module triggers its module-level
        # sys.exit(1), which pytest's collector turns into an INTERNALERROR that aborts the
        # entire run, not just that one file.
        run: pip install -r requirements-dev.txt

      # ── Optional tools verify_security.py / verify_prose.py / generate_openapi.py /
      #    _otel.py wrap — deliberately NOT in requirements.txt (see README.md: these are
      #    opt-in, not framework dependencies). Without installing them here, every test
      #    that exercises the real tool (not the mocked JSON-parsing unit tests) silently
      #    skips instead of running — installing them is what turns "the mock parses this
      #    shape correctly" into "the real tool integration actually works," which is how
      #    two real bugs were caught during development: bare 'eslint' failing via
      #    subprocess on Windows (npm ships .cmd/.ps1 shims, not a .exe — see
      #    verify_security.py's _run_eslint() docstring), and the original eslint config
      #    assuming the legacy .eslintrc system ESLint 9+ removed. Neither would have been
      #    caught by the mocked tests alone.
      - name: Install bandit, semgrep, tree-sitter, opentelemetry (pip)
        run: pip install bandit semgrep tree-sitter tree-sitter-go opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install eslint + eslint-plugin-security (npm)
        # Installed at the repo root (not a subdirectory) — required for
        # require('eslint-plugin-security') to resolve from verify_security.py's
        # generated eslint.config.cjs; see _run_eslint()'s docstring for why location
        # matters here specifically (Node's module resolution walks up from the config
        # file's own directory, not from wherever eslint itself happens to be installed).
        run: npm install --no-save eslint eslint-plugin-security

      - name: Install Vale (prose scan) — Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VALE_VERSION="3.9.5"
          curl -sL -o vale.tar.gz "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          mkdir -p vale-bin
          tar -xzf vale.tar.gz -C vale-bin
          echo "$(pwd)/vale-bin" >> "$GITHUB_PATH"

      - name: Install Vale (prose scan) — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ValeVersion = "3.9.5"
          Invoke-WebRequest -Uri "https://github.com/errata-ai/vale/releases/download/v$ValeVersion/vale_${ValeVersion}_Windows_64-bit.zip" -OutFile vale.zip
          Expand-Archive -Path vale.zip -DestinationPath vale-bin -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$pwd\vale-bin"

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Framework internal consistency audit
        run: python templates/script/framework/verify_framework.py --strict
