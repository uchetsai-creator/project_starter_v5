# workflow-registry.yaml — task_type → validator sequence + pre/post steps
# Used by orchestrator.py to generate .ai/WORKFLOW.md
#
# Each workflow entry lists validators in execution order.
# The orchestrator injects --project-type <type> automatically at runtime.
# Only add extra flags in `args` (e.g. --content, --strict).
#
# Task types: feature | pipeline-stage | bug-fix | sprint-end | eval-run | iac-change
# If the current task type has no entry, the "default" workflow is used.
#
# Phase 48 — --semantic flag for verify_spec_code.py:
#   --semantic is opt-in only. Do NOT add it to any sequence below.
#   Adding --semantic here is a bug — it makes LLM API calls and is not a gate.
#
# verify_security.py (SAST wrapper — bandit / eslint-plugin-security / semgrep):
#   Requires --src to be passed (orchestrator injects it from security_scan_src in
#   .project-starter.yml); skips gracefully if omitted. Independent of verify_spec_code.py —
#   no spec input, just known-unsafe-pattern detection in whatever code is under --src.
#
# verify_prose.py (prose-quality wrapper — Vale):
#   Requires --docs to be passed (orchestrator injects it from docs_path when
#   prose_scan_enabled: true in .project-starter.yml); skips gracefully if omitted.

workflows:

  feature:
    validators:
      - script: docs/script/validators/verify_registry.py
        args: []
      - script: docs/script/validators/verify_docs.py
        args: [--content]
      - script: docs/script/validators/verify_logs.py
        args: [--strict]
      - script: docs/script/validators/verify_content.py
        args: [--strict]
      - script: docs/script/validators/verify_spec_code.py
        args: [--strict]
        # Requires --adapter / --spec / --src to be passed; skips gracefully if omitted.
        # Relevant for: data-pipeline, ml-pipeline, cli-tool (Phase 45)
        #               web-app, microservices, library (Phase 46)
        #               llm-app, mobile-app (Phase 47)
      - script: docs/script/validators/verify_security.py
        args: [--strict]
        # Requires --src to be passed; skips gracefully if omitted.

  pipeline-stage:
    validators:
      - script: docs/script/validators/verify_registry.py
        args: []
      - script: docs/script/validators/verify_docs.py
        args: [--content]
      - script: docs/script/validators/verify_logs.py
        args: [--strict]
      - script: docs/script/validators/verify_content.py
        args: [--strict]
      - script: docs/script/validators/verify_spec_code.py
        args: [--strict]
        # Requires --adapter / --spec / --src to be passed; skips gracefully if omitted.
        # Relevant for: data-pipeline, ml-pipeline (airflow, dagster, prefect adapters)
      - script: docs/script/validators/verify_security.py
        args: [--strict]
        # Requires --src to be passed; skips gracefully if omitted.

  bug-fix:
    validators:
      - script: docs/script/validators/verify_registry.py
        args: []
      - script: docs/script/validators/verify_docs.py
        args: [--content]
      - script: docs/script/validators/verify_content.py
        args: [--strict]
      - script: docs/script/validators/verify_spec_code.py
        args: [--strict]
        # Catches spec–code drift introduced alongside a bug fix.
        # Skips gracefully if --adapter / --spec / --src are not configured.
      - script: docs/script/validators/verify_security.py
        args: [--strict]
        # Requires --src to be passed; skips gracefully if omitted.

  sprint-end:
    validators:
      - script: docs/script/validators/verify_registry.py
        args: []
      - script: docs/script/validators/verify_docs.py
        args: [--content]
      - script: docs/script/validators/verify_logs.py
        args: [--strict]
      - script: docs/script/validators/verify_tests.py
        args: [--strict]
      - script: docs/script/validators/verify_acceptance.py
        args: [--strict]
        # Phase 85 — functional acceptance gate (all 9 project types, no web bias).
        # Checks: FR-XXX declared → test-plan scope covered → test-report ✅ Pass.
        # Type-specific: data-pipeline/ml-pipeline → Contract Tests; llm-app → eval-log ✅.
      - script: docs/script/validators/verify_content.py
        args: [--strict]
      - script: docs/script/validators/verify_index_coverage.py
        args: [--strict]
        # No --project-type: this checks business-objects.md / business-process.md /
        # prompt-library.md index tables against their per-item files — applicability
        # is gated by whether each index file exists, not by project type.
      - script: docs/script/validators/verify_prose.py
        args: [--strict]
        # Requires --docs to be passed (orchestrator injects it from docs_path when
        # prose_scan_enabled: true); skips gracefully if omitted. Placed at sprint-end,
        # not every task type, since it's a prose-quality convergence check, not a
        # per-commit gate the way pre-commit's own trigger (any .md staged) is.

  eval-run:
    validators:
      - script: docs/script/validators/verify_registry.py
        args: []
      - script: docs/script/validators/verify_docs.py
        args: [--content]
      - script: docs/script/validators/verify_content.py
        args: [--strict]
      - script: docs/script/validators/verify_spec_code.py
        args: [--strict]
        # Catches tool-schema drift (llm-contract.md vs. tool_schema/langchain adapters).
        # Skips gracefully if --adapter / --spec / --src are not configured.
        # eval-run is llm-app's primary task type — without this entry, llm-app projects
        # never got the spec-code drift gate at all despite the "feature" workflow's own
        # comment listing llm-app as covered (Phase 47).
      - script: docs/script/validators/verify_security.py
        args: [--strict]
        # Requires --src to be passed; skips gracefully if omitted.

  iac-change:
    validators:
      - script: docs/script/validators/verify_registry.py
        args: []
      - script: docs/script/validators/verify_docs.py
        args: [--content]
      - script: docs/script/validators/verify_content.py
        args: [--strict]
      - script: docs/script/validators/verify_spec_code.py
        args: [--strict]
        # Catches topology drift when IaC code changes without updating topology.md.
        # Skips gracefully if --adapter / --spec / --src are not configured.
        # Relevant for: iac (terraform, pulumi adapters)
      - script: docs/script/validators/verify_security.py
        args: [--strict]
        # Requires --src to be passed; skips gracefully if omitted.
        # Relevant mainly for Pulumi (Python) / Ansible (YAML+Python) IaC code.

  default:
    validators:
      - script: docs/script/validators/verify_registry.py
        args: []
      - script: docs/script/validators/verify_docs.py
        args: [--content]
      - script: docs/script/validators/verify_content.py
        args: [--strict]
